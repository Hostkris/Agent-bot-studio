<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Agent Bot Studio · iOS Preview</title><style>
:root{color-scheme:dark;--bg:#090c13;--surface:#121720;--raised:#1b222f;--line:#303947;--text:#f4f7fb;--muted:#a4b0c1;--dim:#728094;--mint:#6fe4cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}#app{max-width:470px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid #202735;border-right:1px solid #202735}header{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}.brandIcon{width:40px;height:40px;border-radius:13px;background:var(--mint);color:#0b1214;display:grid;place-items:center;font-weight:900;font-size:21px}.brandText{flex:1;font-size:12px;letter-spacing:2px;font-weight:900}.brandText small{display:block;font-size:11px;letter-spacing:0;margin-top:5px;color:var(--dim);font-weight:400}.pill{display:inline-block;background:#1b222f;color:var(--muted);border-radius:60px;font-size:10px;font-weight:800;padding:7px 10px;white-space:nowrap}.mint{background:#0c302e;color:var(--mint)}.page{flex:1;overflow:auto;padding:16px 15px 100px}.band{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:14px;display:flex;align-items:center;gap:12px}.face{position:relative;width:48px;height:48px;border-radius:16px;background:#284b49;display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--mint)}.face:after{content:'';position:absolute;width:9px;height:9px;background:var(--mint);border:2px solid var(--surface);border-radius:50%;right:-2px;bottom:-2px}.band h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;line-height:1.5}.caption{color:var(--dim);font-size:11px}.bubble{background:var(--surface);border:1px solid var(--line);padding:15px;border-radius:18px 18px 18px 5px;margin:17px 0;max-width:92%;line-height:1.55;white-space:pre-wrap}.bubble strong{display:block;letter-spacing:1px;font-size:10px;color:var(--mint);margin-bottom:9px}.bubble.user{background:#193532;border-radius:18px 18px 5px 18px;margin-left:auto}.bubble.user strong{color:var(--mint)}.suggestions{margin-top:35px}.label{font-size:10px;color:var(--muted);letter-spacing:1.2px;font-weight:900;display:block;margin:15px 0 9px}.option,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px}.option{cursor:pointer;display:flex;align-items:center;gap:12px}.option span:last-child{color:var(--mint);font-size:23px;margin-left:auto}.option b,.card b{font-size:15px}.option p{margin:5px 0 0;color:var(--muted);line-height:1.45;font-size:12px}.title{font-size:27px;font-weight:850;margin:5px 0}.card p{color:var(--muted);line-height:1.5}.textinput{width:100%;background:#090c13;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;outline:0}textarea.textinput{min-height:95px;resize:vertical}.submit{border:0;background:var(--mint);font-weight:800;border-radius:12px;padding:12px 18px;color:#091014}.alt{background:var(--raised);color:var(--text);border:1px solid var(--line)}.bar{display:flex;gap:8px}.bar>*{flex:1}.draft{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;color:var(--text);line-height:1.55;font-size:12px;margin:12px 0}.small{font-size:11px;color:var(--dim);line-height:1.5}.chatBottom{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px}.chatBottom input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px;min-width:0}.chatBottom button{border:0;background:var(--mint);border-radius:13px;width:43px;font-size:22px;font-weight:800}nav{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 5px max(11px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:var(--dim);font-size:10px;flex:1;display:flex;align-items:center;gap:4px;flex-direction:column}nav button span{font-size:21px}nav .active{color:var(--mint)}.notice{background:#2c251a;color:#ffd293;border:1px solid #4d3a23;padding:11px 13px;border-radius:12px;margin-top:12px;font-size:12px;line-height:1.6}.flex{display:flex;gap:10px;align-items:center}.flex.space{justify-content:space-between}.hidden{display:none!important}@media(min-width:750px){body{padding:25px 0}#app{height:850px;min-height:0;border:1px solid #334152;border-radius:34px;overflow:hidden;box-shadow:0 20px 70px #0008}nav{position:static}.page{padding-bottom:22px}}
</style></head><body><main id="app"><header><div class="brandIcon">A</div><div class="brandText">AGENT BOT STUDIO<small>One great agent at a time</small></div><span class="pill">PREVIEW</span></header><section id="content" class="page"></section><div class="chatBottom" id="chatbox"><input id="chatinput" placeholder="Message your marketing agent…"/><button id="send">↑</button></div><nav id="nav"></nav></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='agent-bot-studio-preview';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{page:'Chat',botName:'Mira',business:'My business',brief:'',tasks:[],messages:[],selected:null};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const esc=t=>String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const tasks=[['7-day content calendar','Instagram','Plan 7 days of posts and captions'],['Customer research','General','Identify ideal customers and competitors'],['Product launch','Facebook','Draft a new product launch campaign']];const tabs=[['Chat','◉'],['Tasks','▤'],['Approvals','✓'],['Profile','♟'],['Settings','⚙']];const c=$('content');function taskDraft(t){return `LOCAL STARTER DRAFT — preview template, not an AI response.\n\nCAMPAIGN: ${t.title}\nBUSINESS: ${state.business}\nCHANNEL: ${t.platform}\n\nCAPTION\nIntroducing what we're working on at ${state.business}. [Add one truthful product benefit]. [Add an actual available offer]. Discover more today.\n\nVISUAL\nOne clear photo of the product and a prominent call to action.\n\nNEXT STEPS\n1. Verify the information and replace placeholders.\n2. Review the message for the brand.\n3. Approve exact draft before publishing.\n\nSTATUS\nNo connected account. Nothing was posted, sent, scheduled or purchased.`}
function render(){const t=state.tasks.find(x=>x.id===state.selected);const q=state.tasks.filter(x=>x.status==='pending');$('nav').innerHTML=tabs.map(([n,i])=>`<button data-tab="${n}" class="${state.page===n?'active':''}"><span>${i}</span>${n}${n==='Approvals'&&q.length?' ('+q.length+')':''}</button>`).join('');$('chatbox').classList.toggle('hidden',state.page!=='Chat');let html='';if(state.page==='Chat'){html=`<div class="band"><div class="face">M</div><div style="flex:1"><h2>${esc(state.botName)} ✧</h2><div class="sub">Marketing strategist · Research & creative</div></div><span class="pill mint">AGENT 01</span></div>`;let messages=state.messages.length?state.messages:[{role:'assistant',content:'I’m Mira, your Marketing Agent. Give me an assignment, and I’ll help prepare campaigns, content, and research.\n\nThis browser preview has no AI service. The native iOS version connects to Grok through a separate backend.'}];html+=messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'YOU':'MIRA'}</strong>${esc(m.content)}</div>`).join('');if(!state.messages.length)html+=`<div class="suggestions"><span class="label">TRY AN ASSIGNMENT</span><div class="option" data-nav="Tasks"><div><b>7-day Instagram campaign</b><p>Create a task and review your first draft</p></div><span>→</span></div><div class="option" data-nav="Profile"><div><b>Teach your bot the brand</b><p>Enter your business information and voice</p></div><span>→</span></div></div>`}
if(state.page==='Tasks'){html=`<div class="flex space"><div><div class="title">Assignments</div><div class="sub">One agent. Clear, reviewable work.</div></div><button class="submit" data-act="new">+ New</button></div>`;if(state.new)html+=`<div class="card"><b>Create an assignment</b><span class="label">TASK NAME</span><input id="taskname" class="textinput" placeholder="e.g., Product launch"/><span class="label">GOAL</span><textarea id="taskgoal" class="textinput" placeholder="What should the agent prepare?"></textarea><span class="label">PLATFORM</span><select id="taskplatform" class="textinput">${['Instagram','TikTok','Facebook','X','Email','Website','General'].map(v=>`<option>${v}</option>`).join('')}</select><br/><br/><button class="submit" data-act="add">Save assignment</button></div>`;if(!state.tasks.length)html+=`<div class="card"><b>Your queue is empty</b><p>Choose one template to create your first marketing assignment.</p></div><span class="label">START WITH A TEMPLATE</span>${tasks.map(([name,p,goal],i)=>`<div class="option" data-example="${i}"><div><b>${name}</b><p>${p} · ${goal}</p></div><span>+</span></div>`).join('')}`;html+=state.tasks.map(x=>`<div class="option" style="display:block;border-color:${t?.id===x.id?'var(--mint)':'var(--line)'}" data-task="${x.id}"><div class="flex space"><b>${esc(x.title)}</b><span class="pill ${x.status==='approved'?'mint':''}">${x.status.toUpperCase()}</span></div><p>${esc(x.platform)} · ${esc(x.goal)}</p>${t?.id===x.id?`${x.draft?`<div class="draft">${esc(x.draft)}</div>${x.status==='draft'?'<button class="submit" data-act="request">Request my approval</button>':''}`:'<button class="submit" data-act="draft">Create local starter draft</button>'}<p class="small">No real external actions in this preview.</p>`:''}</div>`).join('')}
if(state.page==='Approvals'){html=`<div class="title">Approval center</div><p class="sub">Explicit review before any external action. This version records draft decisions only.</p>`;html+=q.length?q.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.platform)} · Draft review only</p><div class="draft">${esc(x.draft)}</div><div class="bar"><button class="submit alt" data-decide="${x.id}:rejected">Reject</button><button class="submit" data-decide="${x.id}:approved">Approve draft</button></div></div>`).join(''):`<div class="card" style="text-align:center;padding:36px 20px"><div style="font-size:30px">✧</div><b>No approvals waiting</b><p>Prepare a draft, then request approval.</p></div>`;html+=`<div class="notice">Approval records your decision. It does not publish, email, connect accounts, or change ad spending.</div>`}
if(state.page==='Profile'){html=`<div class="title">Employee profile</div><div class="band"><div class="face" style="height:60px;width:60px">M</div><div><h2>${esc(state.botName)}</h2><div class="sub">Marketing Agent · Bot 01</div><span class="pill mint">EDITABLE</span></div></div><div class="card" style="margin-top:13px"><span class="label">BOT NAME</span><input id="botname" class="textinput" value="${esc(state.botName)}"/><span class="label">BUSINESS NAME</span><input id="business" class="textinput" value="${esc(state.business)}"/><span class="label">BRAND BRIEF</span><textarea id="brief" class="textinput" placeholder="Who do you serve? What do you sell? What voice should the bot use?">${esc(state.brief)}</textarea><br/><br/><button class="submit" data-act="saveProfile">Save profile</button></div><div class="card"><b>Marketing job boundaries</b><p>Draft content, research, campaign recommendations. No publishing, sending, billing, or ad spending.</p></div>`}
if(state.page==='Settings'){html=`<div class="title">Connections</div><p class="sub">The preview is an interactive layout demonstration.</p><div class="card"><b>Live AI requires the native app</b><p>For real Grok responses, use the Expo iOS app and its separate secure server. This HTML preview doesn't request, store, or process API keys.</p><span class="pill">NO API CONNECTED</span></div><div class="card"><b>Works in this preview</b><p>✓ Create tasks<br/>✓ Prepare local starter drafts<br/>✓ Request approvals<br/>✓ Approve or reject<br/>✓ Edit brand notes</p></div><div class="card"><b>Not simulated</b><p>Real AI chat, publishing, private analytics, external accounts, background tasks, and cloud computers.</p></div><div class="notice">This is an independent visual prototype. It is not the Grok Bot service or OpenMausBot application.</div>`}
c.innerHTML=html;}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){state.page=b.dataset.tab;save();render()}});
c.addEventListener('click',e=>{const el=e.target.closest('[data-example],[data-task],[data-act],[data-decide],[data-nav]');if(!el)return;const ds=el.dataset;if(ds.nav){state.page=ds.nav;}if(ds.example!==undefined){const [title,platform,goal]=tasks[Number(ds.example)];const id='t'+Date.now();state.tasks.unshift({id,title,platform,goal,status:'queued',draft:''});state.selected=id;}if(ds.task){state.selected=ds.task;}if(ds.act==='new')state.new=!state.new;if(ds.act==='add'){let name=$('taskname').value.trim();if(!name){alert('Enter an assignment name.');return}const id='t'+Date.now();state.tasks.unshift({id,title:name,goal:$('taskgoal').value,platform:$('taskplatform').value,status:'queued',draft:''});state.selected=id;state.new=false;}if(ds.act==='draft'){const t=state.tasks.find(x=>x.id===state.selected);t.draft=taskDraft(t);t.status='draft';}if(ds.act==='request'){state.tasks.find(x=>x.id===state.selected).status='pending';}if(ds.decide){const [id,status]=ds.decide.split(':');state.tasks.find(x=>x.id===id).status=status;alert(status==='approved'?'Draft approved. No external action executed.':'Draft rejected.');}if(ds.act==='saveProfile'){state.botName=$('botname').value.trim()||'Mira';state.business=$('business').value.trim()||'My business';state.brief=$('brief').value;alert('Profile saved on this browser.');}save();render();});
$('send').addEventListener('click',()=>{const input=$('chatinput');const content=input.value.trim();if(!content)return;state.messages.push({role:'user',content});state.messages.push({role:'assistant',content:'This is the standalone interface preview, not an AI reply. To ask a real Grok model, run the native iOS app and connect your xAI backend in Settings.'});save();render();$('chatinput').value='';c.scrollTop=c.scrollHeight;});$('chatinput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('send').click();e.preventDefault()}});render();
})();
</script></body></html>
