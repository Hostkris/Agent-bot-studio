.button.danger{background:#3a222e;border-color:#6e3441;color:#ffb6b9}.button.tiny{padding:7px 10px;font-size:11px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--muted);line-height:1.55}.empty{text-align:center;padding:38px 19px}.empty .emoji{font-size:31px;display:block;margin-bottom:15px}.empty h2{margin-bottom:8px}.empty p{color:var(--muted)}.chat{max-width:830px;margin:auto;display:flex;flex-direction:column;gap:12px}.message{padding:15px 17px;max-width:89%;border:1px solid var(--border);border-radius:17px;border-bottom-left-radius:5px;background:#142131;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.message.user{align-self:flex-end;background:#193e3b;border-color:#2d6159;border-bottom-left-radius:17px;border-bottom-right-radius:5px}.message header{font-size:10px;letter-spacing:1px;color:var(--mint);font-weight:800;margin-bottom:8px}.message footer{color:#94a6b5;font-size:10px;margin-top:12px}.notice{border:1px solid #645133;background:#292315;border-radius:12px;color:#f7d9a5;padding:13px 14px;font-size:12px;line-height:1.55;margin-top:13px}.notice.safe{border-color:#2b6159;background:#112b2a;color:#bae9df}.composer{flex:0 0 auto;display:flex;align-items:end;gap:11px;padding:14px 24px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#0c1521}.composer textarea{width:100%;border:1px solid #33455b;border-radius:15px;background:#152436;resize:none;color:var(--text);padding:14px;min-height:49px;max-height:150px;outline:0}.send-button{height:49px;width:49px;border:0;border-radius:14px;background:var(--mint);color:#0b2723;font-size:20px;flex-shrink:0}.draft{background:#0c1724;border:1px solid var(--border);border-radius:13px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:12px;color:#cbd9e6;margin:13px 0}.task-title{font-weight:780;margin-bottom:7px;font-size:15px}.task-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.task-card .small{margin-top:8px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.section-title h1{margin:0}.section-title p{margin:6px 0 0;color:var(--muted);font-size:12px}.tool-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--border)}.tool-line:first-child{border-top:0}.tool-line strong{display:block;font-size:13px}.tool-line small{display:block;margin-top:5px;color:var(--muted)}.switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}.switch input{width:17px;height:17px;accent-color:#77ecd3}.modal-backdrop,.shade{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:center;padding:20px}.dialog{border:1px solid #39516c;background:#121f2e;border-radius:23px;padding:24px;width:min(550px,100%);max-height:90dvh;overflow-y:auto;box-shadow:0 22px 70px #000b;position:relative}.dialog h2{font-size:22px;padding-right:40px}.modal-close{position:absolute;right:17px;top:14px;border:0;color:var(--muted);background:transparent;font-size:29px}.toast{z-index:100;position:fixed;bottom:25px;right:25px;background:#1b3b38;color:#dcfff5;border:1px solid #3b806d;border-radius:14px;padding:14px 17px;max-width:450px;box-shadow:0 12px 35px #0006}.mobile-nav{display:none}.divider{border:0;border-top:1px solid var(--border);margin:20px 0}.kbd{background:#1e3146;border-radius:5px;padding:2px 5px;font-size:10px}.list{padding-left:18px;color:var(--muted);line-height:1.8}.stat{background:#112334;border:1px solid var(--border);border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px}.stat small{color:var(--muted)}.spaced>*+*{margin-top:12px}
@media(max-width:860px){.sidebar{position:fixed;z-index:75;top:0;bottom:0;left:0;transform:translateX(-110%);transition:transform .2s;box-shadow:12px 0 30px #0006}.sidebar.open{transform:translateX(0)}.shade{z-index:70}.mobile-icon{display:block}.section-nav{gap:17px;padding:0 17px}.topbar{padding:12px 17px}.main{padding:17px}.composer{padding:11px 15px calc(11px + env(safe-area-inset-bottom))}.grid-three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.topbar{height:65px;flex-basis:65px}.section-nav{display:none}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);flex:0 0 auto;background:#0e1723;border-top:1px solid var(--border);padding:9px 5px max(9px,env(safe-area-inset-bottom))}.mobile-nav button{display:flex;align-items:center;gap:5px;flex-direction:column;border:0;background:transparent;color:#889cb1;font-size:10px;padding:4px 0}.mobile-nav button span{font-size:21px}.mobile-nav button.active{color:var(--mint);font-weight:850}.main{padding:16px 13px}.composer{padding:10px 12px}.hero{padding:15px}.top-actions .icon-button{display:none}.status-badge{padding:7px;font-size:9px}.grid,.grid-three{grid-template-columns:1fr}.message{max-width:95%}.section-title{align-items:flex-start}.section-title h1{font-size:23px}.toast{bottom:90px;right:12px;left:12px;max-width:none}.dialog{padding:20px}}

  <title>Agent Bot Studio — Free Safari Edition</title>

</head>
<body>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Agent list">
      <div class="logo"><span class="brand-mark" aria-hidden="true">✳</span><div><strong>AGENT BOT STUDIO</strong><small>Free Safari Edition</small></div></div>
      <div class="side-caption">YOUR WORKFORCE <span id="agentCount">01</span></div>
      <div id="botList" class="bot-list"></div>
      <button id="addBot" class="new-bot">＋ Create new bot</button>
      <div class="sidebar-foot"><div class="privacy-dot"></div><span>Private browser workspace</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><button id="rosterToggle" class="mobile-icon" aria-label="Show bot roster">☷</button><div class="top-agent"><div id="topAvatar" class="tiny-avatar">M</div><div><strong id="topName">Mira</strong><small id="topRole">Marketing Agent</small></div></div><div class="top-actions"><span class="status-badge" id="backendStatus">● LOCAL MODE</span><button id="topNew" class="icon-button" title="New bot" aria-label="Create new bot">＋</button></div></header>
      <nav class="section-nav" aria-label="Workspace sections"><button data-page="chat">Chat</button><button data-page="tasks">Assignments</button><button data-page="approvals">Approvals <span id="approvalCount"></span></button><button data-page="profile">Profile</button><button data-page="settings">Connections</button></nav>
      <main id="main" class="main" aria-live="polite"></main>
      <form id="composer" class="composer" hidden><label for="messageInput" class="sr-only">Message</label><textarea id="messageInput" rows="1" maxlength="6000" placeholder="Give your agent an assignment…"></textarea><button id="sendMessage" type="submit" class="send-button" aria-label="Send message">➤</button></form>
      <nav id="mobileNav" class="mobile-nav" aria-label="Mobile workspace navigation"><button data-page="chat"><span>◉</span>Chat</button><button data-page="tasks"><span>▤</span>Tasks</button><button data-page="approvals"><span>✓</span>Approvals</button><button data-page="profile"><span>♙</span>Profile</button><button data-page="settings"><span>⚙</span>Settings</button></nav>
    </div>
  </div>
  <div id="shade" class="shade" hidden></div>
  <div id="modal" class="modal-backdrop" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="closeModal" class="modal-close" aria-label="Close">×</button><h2 id="modalTitle">New bot</h2><div id="modalBody"></div></div></div>
  <div id="toast" role="status" class="toast" hidden></div>
<script>
/* Agent Bot Studio — original Safari-first UI. No OpenMausBot proprietary code. */
(() => {
  'use strict';
  const STORAGE_KEY = 'agent-bot-studio:safari-free:v1';
  const el = id => document.getElementById(id);
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => (globalThis.crypto?.randomUUID?.() ?? 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
  const now = () => new Date().toISOString();
  const safeDate = iso => { try { return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); } catch { return ''; } };
  const defaultBot = () => ({id:'mira-marketing',name:'Mira',role:'Marketing Manager',brief:'',instructions:'Research audiences, plan ethical campaigns, draft accurate content, prepare marketing reports. Never publish, send a message, connect accounts, change ad budgets, or spend money without the owner personally approving the exact action.',created:now()});
  const initial = () => ({version:1,page:'chat',activeBot:'mira-marketing',bots:[defaultBot()],messages:{'mira-marketing':[]},tasks:[],routines:[],activity:[],settings:{apiUrl:'',search:false}});
  let state;
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch {}
  if (!state || !Array.isArray(state.bots) || !state.bots.length) state = initial();
  state.messages ||= {}; state.tasks ||= []; state.routines ||= []; state.activity ||= []; state.settings ||= {apiUrl:'',search:false};
  if (!state.bots.some(b => b.id === state.activeBot)) state.activeBot = state.bots[0].id;
  if (!['chat','tasks','approvals','profile','settings'].includes(state.page)) state.page = 'chat';
  let sessionToken = sessionStorage.getItem('agent-bot-studio:sessionToken') || '';
  let busy = false;
  let toastTimer;
  const bot = () => state.bots.find(b => b.id === state.activeBot) || state.bots[0];
  const save = () => { try {localStorage.setItem(STORAGE_KEY, JSON.stringify(state));} catch {toast('Local storage is full or unavailable. Export your workspace.');} };
  function log(text, botId = state.activeBot) {state.activity.unshift({id:uid(),botId,text,when:now()});state.activity=state.activity.slice(0,200);}
  function toast(message) {const t=el('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3600);}
  const status = value => ({queued:['QUEUED',''],draft:['DRAFT','blue'],pending:['AWAITING APPROVAL','gold'],approved:['APPROVED','mint'],rejected:['REJECTED','red']})[value]||[String(value).toUpperCase(),''];
  const pill = value => {const [name,color]=status(value);return `<span class="pill ${color}">${escapeHTML(name)}</span>`;};
  const field = (label,id,value='',multi=false,placeholder='') => `<label class="field"><span>${escapeHTML(label)}</span>${multi ? `<textarea class="control" id="${id}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(value)}</textarea>` : `<input class="control" id="${id}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" />`}</label>`;
  function closeSidebar(){el('sidebar').classList.remove('open');el('shade').hidden=true;}
  function showModal(title,contents){el('modalTitle').textContent=title;el('modalBody').innerHTML=contents;el('modal').hidden=false;el('modalBody').querySelector('input,textarea,select')?.focus();}
  function closeModal(){el('modal').hidden=true;el('modalBody').replaceChildren();}
  function updateHeader(){const b=bot();el('topName').textContent=b.name;el('topRole').textContent=b.role;el('topAvatar').textContent=b.name.slice(0,1).toUpperCase();el('agentCount').textContent=String(state.bots.length).padStart(2,'0');const apiConnected=!!state.settings.apiUrl&&!!sessionToken;el('backendStatus').textContent=apiConnected?'● AI READY':'● LOCAL MODE';el('backendStatus').className='status-badge'+(apiConnected?' live':'');el('approvalCount').textContent=state.tasks.filter(t=>t.status==='pending').length||'';el('approvalCount').hidden=!state.tasks.some(t=>t.status==='pending');el('botList').innerHTML=state.bots.map(b=>`<button class="bot-choice ${b.id===state.activeBot?'selected':''}" data-action="choose-bot" data-id="${escapeHTML(b.id)}"><div class="bot-avatar ${b.id===state.activeBot?'':'blue'}">${escapeHTML(b.name[0]?.toUpperCase()||'A')}</div><span><span class="bname">${escapeHTML(b.name)}</span><span class="brole">${escapeHTML(b.role)}</span></span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false')});el('composer').hidden=state.page!=='chat';}
  function render(){updateHeader();el('main').innerHTML=({chat:renderChat,tasks:renderTasks,approvals:renderApprovals,profile:renderProfile,settings:renderSettings})[state.page]();if(state.page==='chat')el('main').scrollTop=el('main').scrollHeight;save();}
  function renderChat(){const b=bot(), msgs=state.messages[b.id]||[];return `<div class="chat"><div class="hero"><div class="bot-avatar">${escapeHTML(b.name[0]||'M')}</div><div><h2>${escapeHTML(b.name)} <span class="pill mint">BOT ${String(state.bots.indexOf(b)+1).padStart(2,'0')}</span></h2><p>${escapeHTML(b.role)} · Your own private assistant</p></div></div>${msgs.length?msgs.map(m=>`<article class="message ${m.role==='user'?'user':''}"><header>${m.role==='user'?'YOU':m.mode==='offline'?'LOCAL HELPER — NOT AI':escapeHTML(b.name.toUpperCase())}</header>${escapeHTML(m.text)}<footer>${safeDate(m.when)}${m.mode==='offline'?' · Not generated by AI':''}</footer></article>`).join(''):`<div class="panel empty"><span class="emoji">✦</span><h2>Give ${escapeHTML(b.name)} a job</h2><p>Use this chat to plan marketing work. The free offline mode saves conversations and produces clearly labeled starter templates. Real model responses require your own secure server.</p><div class="buttons" style="justify-content:center"><button class="button" data-action="new-task">＋ First assignment</button><button class="button secondary" data-action="quick-local">Create a starter plan</button></div></div>`}<div class="notice safe"><strong>Access stays with you.</strong> No social accounts are connected. Approving a draft does not post, message, or spend money.</div></div>`;}
  function renderTasks(){const mine=state.tasks.filter(t=>t.botId===state.activeBot).sort((a,b)=>b.created.localeCompare(a.created));return `<div class="content-limit"><div class="section-title"><div><h1>Assignments</h1><p>Work assigned specifically to ${escapeHTML(bot().name)}.</p></div><button class="button" data-action="new-task">＋ New task</button></div><div class="grid-three"><div class="stat"><strong>${mine.length}</strong><small>All assignments</small></div><div class="stat"><strong>${mine.filter(t=>t.status==='pending').length}</strong><small>Awaiting review</small></div><div class="stat"><strong>${mine.filter(t=>t.status==='approved').length}</strong><small>Approved drafts</small></div></div><div style="height:18px"></div>${mine.length?mine.map(t=>renderTask(t)).join(''):`<div class="panel empty"><span class="emoji">▤</span><h2>No assignments yet</h2><p>Create a task or start with a marketing template.</p><div class="buttons" style="justify-content:center"><button class="button secondary" data-action="template-task" data-template="calendar">7-day content calendar</button><button class="button secondary" data-action="template-task" data-template="launch">Product launch</button></div></div>`}<div class="panel"><div class="row"><div><h3>Manual routines</h3><p class="small">A routine creates a task when you press Run. Free static hosting cannot execute it in the background.</p></div><button class="button secondary tiny" data-action="new-routine">＋ Routine</button></div>${state.routines.filter(r=>r.botId===state.activeBot).map(r=>`<div class="tool-line"><div><strong>${escapeHTML(r.title)}</strong><small>${escapeHTML(r.goal)}</small></div><div class="buttons"><button class="button secondary tiny" data-action="run-routine" data-id="${escapeHTML(r.id)}">Run now</button><button class="button ghost tiny" data-action="delete-routine" data-id="${escapeHTML(r.id)}">Remove</button></div></div>`).join('')}</div></div>`;}
  function renderTask(t){return `<article class="task-card"><div class="row"><div class="task-title">${escapeHTML(t.title)}</div>${pill(t.status)}</div><div class="task-meta"><span class="pill">${escapeHTML(t.platform)}</span><span class="small">${safeDate(t.created)}</span></div><p class="small">${escapeHTML(t.goal)}</p>${t.draft?`<div class="draft">${escapeHTML(t.draft)}</div>`:''}<div class="buttons">${['queued','rejected','draft'].includes(t.status)?`<button class="button ${t.draft?'secondary':''} tiny" data-action="generate-task" data-id="${escapeHTML(t.id)}">${t.draft?'Regenerate':'Prepare'} draft</button>`:''}${t.status==='draft'?`<button class="button tiny" data-action="request-approval" data-id="${escapeHTML(t.id)}">Request approval</button>`:''}<button class="button ghost tiny" data-action="delete-task" data-id="${escapeHTML(t.id)}">Delete</button></div></article>`;}
  function renderApprovals(){const tasks=state.tasks.filter(t=>t.status==='pending').sort((a,b)=>b.created.localeCompare(a.created));return `<div class="content-limit"><div class="section-title"><div><h1>Approval center</h1><p>Approve an exact draft before any future external action.</p></div>${pill('pending')}</div>${tasks.length?tasks.map(t=>`<article class="task-card"><div class="row"><strong>${escapeHTML(t.title)}</strong><span class="pill">${escapeHTML(state.bots.find(b=>b.id===t.botId)?.name||'Agent')}</span></div><p class="small">Channel: ${escapeHTML(t.platform)}</p><div class="draft">${escapeHTML(t.draft)}</div><div class="buttons"><button class="button danger" data-action="reject-task" data-id="${escapeHTML(t.id)}">Reject draft</button><button class="button" data-action="approve-task" data-id="${escapeHTML(t.id)}">Approve draft</button></div></article>`).join(''):`<div class="panel empty"><span class="emoji">✓</span><h2>Nothing awaiting approval</h2><p>Create a task, prepare a draft, and submit it for your review.</p></div>`}<div class="notice">Draft approval records your decision only. No external publishing, emailing, advertising charges, or account changes are implemented in this free edition.</div></div>`;}
  function renderProfile(){const b=bot();return `<div class="content-limit"><div class="section-title"><div><h1>Employee profile</h1><p>Each agent has its own instructions and saved assignments.</p></div><span class="pill mint">EDITABLE</span></div><div class="hero"><div class="bot-avatar">${escapeHTML(b.name[0])}</div><div><h2>${escapeHTML(b.name)}</h2><p>${escapeHTML(b.role)}</p></div></div><form id="profileForm" class="panel">${field('BOT NAME','profileName',b.name)}${field('JOB TITLE','profileRole',b.role)}${field('BUSINESS / BRAND BRIEF','profileBrief',b.brief,true,'What do you sell? Who do you serve? What tone should the bot use?')}${field('JOB RULES AND LIMITS','profileInstructions',b.instructions,true)}<div class="buttons"><button type="submit" class="button">Save employee</button><button type="button" class="button secondary" data-action="duplicate-bot">Duplicate employee</button>${state.bots.length>1?'<button type="button" class="button danger" data-action="delete-bot">Delete employee</button>':''}</div></form><div class="panel"><h3>Assigned responsibilities</h3><p>Writing campaigns, producing drafts, reporting on supplied data, and preparing plans. Outside access is always disabled until you explicitly connect and authorize a supported tool.</p><span class="pill">NO CONNECTED ACCOUNT</span></div><div class="panel"><h3>Recent activity</h3>${state.activity.filter(a=>a.botId===b.id).slice(0,10).map(a=>`<div class="tool-line"><span>${escapeHTML(a.text)}</span><small>${safeDate(a.when)}</small></div>`).join('')||'<p class="small">No recorded activities yet.</p>'}</div></div>`;}
  function renderSettings(){return `<div class="content-limit"><div class="section-title"><div><h1>Connections & settings</h1><p>Your bot only gains access you configure.</p></div><span class="pill mint">FREE SOFTWARE</span></div><div class="panel"><h2>Optional live AI server</h2><p>The Safari app is free and works offline. For real Grok responses, run your own server with an xAI API key. AI usage and hosting may cost money.</p><form id="settingsForm">${field('HTTPS BACKEND ADDRESS','apiUrl',state.settings.apiUrl||'',false,'https://your-secure-agent-server.example') }<label class="field"><span>ACCESS TOKEN (STORED ONLY FOR THIS TAB SESSION)</span><input id="apiToken" class="control" type="password" autocomplete="off" placeholder="At least 24 characters" value="${escapeHTML(sessionToken)}" /></label><label class="switch"><input id="enableSearch" type="checkbox" ${state.settings.search?'checked':''}/> Use optional web research when supported by your AI server</label><div class="buttons"><button type="submit" class="button">Save connection</button><button type="button" class="button secondary" data-action="test-api">Test backend</button><button type="button" class="button ghost" data-action="disconnect-api">Disconnect</button></div></form><div class="notice">Never put your model API key in this browser or repository. The access token is for your own secured backend. If using GitHub Pages, the backend must use HTTPS and explicitly allow this site's origin.</div></div><div class="panel"><h2>Platform permissions</h2><p class="small">These services are not connected in this edition. Each future connection needs separate approval and a supported provider authorization flow.</p>${[['Instagram','Content drafts and insights'],['Facebook','Content drafts and page insights'],['TikTok','Research and approved publishing'],['Shopify','Products and store analytics'],['Gmail','Campaign email drafts'],['X','Research and publishing']].map(([name,desc])=>`<div class="tool-line"><div><strong>${name}</strong><small>${desc}</small></div><span class="pill">NOT CONNECTED</span></div>`).join('')}</div><div class="panel"><h2>Local data and backups</h2><p>Data is stored in this browser's local storage. Clearing Safari website data may erase it. Export regularly; different devices do not sync without a server.</p><div class="buttons"><button class="button secondary" data-action="export-data">Export JSON backup</button><label for="importFile" class="button ghost" style="cursor:pointer">Import backup</label><input id="importFile" type="file" accept=".json,application/json" hidden /></div></div><div class="panel"><h2>About Agent Bot Studio</h2><p class="small">Independent web application inspired by OpenMausBot's open-source agent workspace design. No proprietary code or trademarks are included. This is not a hosted OpenMausBot subscription or a clone of its full agent runtime.</p><a href="https://github.com/milind-soni/OpenMausBot" rel="noopener noreferrer" target="_blank">Explore OpenMausBot source and Apache 2.0 licensing ↗</a></div></div>`;}
  function goto(page){state.page=page;closeSidebar();render();}
  function starterDraft(t,b){const name=b.name, brand=b.brief?b.brief.trim().slice(0,250):'[enter brand information in the employee profile]';return `LOCAL STARTER TEMPLATE — NOT AI RESEARCH\n\nASSIGNMENT: ${t.title}\nPLATFORM: ${t.platform}\nBRAND BRIEF: ${brand}\n\nGOAL\n${t.goal||'[state your campaign goal]'}\n\nSAMPLE CAPTION\nWe’re excited to share what’s new. [Insert a verified product benefit]. [Include a truthful offer or reason to visit]. Learn more: [insert approved link].\n\nCREATIVE PLAN\n• A high-quality, original product or customer-use photo\n• A brief, readable headline\n• A clear call to action matched to ${t.platform}\n\nREVIEW CHECKLIST\n□ Verify every product claim and price\n□ Confirm image rights and brand voice\n□ Approve final caption and creative\n□ Connect an authorized publisher separately (not available here)\n\nGenerated locally using a fixed template for ${name}. Nothing was researched, published, scheduled, sent, or purchased.`;}
  function localChatReply(input,b){const s=input.toLowerCase();if(/caption|post|campaign|market|launch|content|promotion|ad\b/.test(s)){return `LOCAL WORKSHEET — not an AI response.\n\nYour request: ${input.slice(0,300)}\n\n1. Audience: [Who is this for?]\n2. Benefit: [What truthful benefit can you prove?]\n3. Content idea: Show one clear customer problem, then demonstrate your solution.\n4. Caption starter: “Looking for [benefit]? Here is how [business name] can help. [Verified detail]. [Approved call to action].”\n5. Review: Check all claims, prices and imagery before approving.\n\nFor research and custom content, connect your secure AI backend in Connections.`;}return `Saved your message in this browser. This is the free offline workspace, not an AI conversation.\n\nYou can create assignments, edit this agent's profile, prepare local templates, and review drafts now. Configure your secure AI backend under Connections for live responses.`;}
  async function requestAI(payload){if(!state.settings.apiUrl||!sessionToken)throw new Error('No AI backend connected.');const url=state.settings.apiUrl.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url))throw new Error('Use an HTTPS backend URL (or HTTP localhost for development).');const res=await fetch(url+'/api/respond',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${sessionToken}`},body:JSON.stringify(payload),signal:AbortSignal.timeout?AbortSignal.timeout(100000):undefined});let data;try{data=await res.json();}catch{throw new Error('The server returned invalid JSON.');}if(!res.ok)throw new Error(data.error||`AI server returned ${res.status}`);if(!data.answer||typeof data.answer!=='string')throw new Error('Server returned no answer.');return data.answer;}
  async function sendMessage(text){const b=bot(),id=b.id;state.messages[id]||=[];state.messages[id].push({id:uid(),role:'user',text,when:now()});const history=state.messages[id].filter(m=>m.role==='user'||m.mode==='live').slice(-50).map(m=>({role:m.role,content:m.text}));if(!state.settings.apiUrl||!sessionToken){state.messages[id].push({id:uid(),role:'assistant',text:localChatReply(text,b),when:now(),mode:'offline'});log('Used local chat worksheet',id);render();return;}render();if(busy)return;busy=true;el('sendMessage').disabled=true;try{const answer=await requestAI({messages:history,brandBrief:((b.brief||'')+'\nJOB RULES: '+(b.instructions||'')).slice(0,6000),search:state.settings.search===true});state.messages[id].push({id:uid(),role:'assistant',text:answer,when:now(),mode:'live'});log('Received live AI reply',id);}catch(e){state.messages[id].push({id:uid(),role:'assistant',text:`AI request failed: ${e.message}. No content was generated.`,when:now(),mode:'offline'});toast('Unable to reach AI backend');}finally{busy=false;render();}}
  async function generateTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const b=state.bots.find(x=>x.id===t.botId)||bot();if(!state.settings.apiUrl||!sessionToken){t.draft=starterDraft(t,b);t.status='draft';t.updated=now();log('Created local starter draft',b.id);render();toast('Local starter draft created. No AI model was used.');return;}if(busy)return;busy=true;try{const answer=await requestAI({task:{title:t.title,goal:t.goal,platform:t.platform},brandBrief:((b.brief||'')+'\nJOB RULES: '+(b.instructions||'')).slice(0,6000),search:state.settings.search===true});t.draft=answer;t.status='draft';t.updated=now();log('Generated draft via AI backend',b.id);toast('Draft generated. Review before requesting approval.');}catch(e){toast(`AI draft failed: ${e.message}`);}finally{busy=false;render();}}
  function newTaskModal(template){const values=template==='calendar'?{title:'7-day content calendar',goal:'Draft 7 different posts, one per day, with caption ideas and calls to action.',platform:'Instagram'}:template==='launch'?{title:'Product launch campaign',goal:'Prepare a launch sequence for a product, with honest claims and a review checklist.',platform:'Facebook'}:{title:'',goal:'',platform:'Instagram'};showModal('New marketing assignment',`<form id="newTaskForm">${field('ASSIGNMENT NAME','taskTitle',values.title,false,'e.g., New product launch')}${field('GOAL / DELIVERABLE','taskGoal',values.goal,true,'What should the bot prepare?')}<label class="field"><span>CHANNEL</span><select class="control" id="taskPlatform">${['Instagram','Facebook','TikTok','X','Email','Website','Shopify','General'].map(n=>`<option ${n===values.platform?'selected':''}>${n}</option>`).join('')}</select></label><div class="buttons"><button class="button" type="submit">Save assignment</button><button class="button secondary" type="button" data-action="close-modal">Cancel</button></div></form>`);}
  function newBotModal(){showModal('Create an AI employee',`<form id="newBotForm">${field('EMPLOYEE NAME','newBotName','',false,'e.g., Toni')}${field('ROLE','newBotRole','Social Media Specialist',false,'e.g., Content Manager')}${field('SPECIALIZED INSTRUCTIONS','newBotInstructions','Draft marketing work and request approval before all external actions.',true)}<div class="notice safe">Each employee gets its own profile, conversations, and assignments. Creating a bot never connects an external account.</div><div class="buttons"><button class="button" type="submit">Create bot</button><button class="button secondary" type="button" data-action="close-modal">Cancel</button></div></form>`);}
  function newRoutineModal(){showModal('Create manual routine',`<form id="newRoutineForm">${field('ROUTINE NAME','routineTitle','Weekly campaign planning')}${field('TASK CREATED WHEN RUN','routineGoal','Draft a weekly campaign plan for this brand.',true)}<div class="notice">This routine only runs when you press Run now. It does not run in the background.</div><button class="button" type="submit">Save routine</button></form>`);}
  document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){goto(p.dataset.page);return;}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.id,t=state.tasks.find(x=>x.id===id);if(action==='choose-bot'){state.activeBot=id;goto('chat');return;}if(action==='new-bot'){newBotModal();return;}if(action==='new-task'){newTaskModal();return;}if(action==='template-task'){newTaskModal(a.dataset.template);return;}if(action==='quick-local'){newTaskModal('calendar');return;}if(action==='close-modal'){closeModal();return;}if(action==='generate-task'){await generateTask(id);return;}if(action==='request-approval'&&t&&t.status==='draft'){t.status='pending';t.updated=now();log(`Requested approval: ${t.title}`,t.botId);toast('Draft added to Approval Center');render();return;}if(action==='approve-task'&&t&&t.status==='pending'){t.status='approved';t.updated=now();log(`Approved draft: ${t.title} (no publishing)`,t.botId);toast('Draft approved. Nothing was published.');render();return;}if(action==='reject-task'&&t&&t.status==='pending'){t.status='rejected';t.updated=now();log(`Rejected draft: ${t.title}`,t.botId);toast('Draft rejected');render();return;}if(action==='delete-task'&&t){if(confirm(`Delete assignment “${t.title}”?`)){state.tasks=state.tasks.filter(x=>x.id!==id);log(`Deleted assignment: ${t.title}`,t.botId);render();}return;}if(action==='new-routine'){newRoutineModal();return;}if(action==='run-routine'){const r=state.routines.find(x=>x.id===id);if(r){state.tasks.unshift({id:uid(),botId:r.botId,title:r.title,goal:r.goal,platform:'General',status:'queued',draft:'',created:now()});log('Manually ran routine: '+r.title,r.botId);toast('New task created from routine');render();}return;}if(action==='delete-routine'){state.routines=state.routines.filter(x=>x.id!==id);render();return;}if(action==='duplicate-bot'){const b=bot(),dup={...b,id:uid(),name:b.name+' Copy',created:now()};state.bots.push(dup);state.messages[dup.id]=[];state.activeBot=dup.id;log('Created new agent profile');render();toast('Employee duplicated (without conversations)');return;}if(action==='delete-bot'&&state.bots.length>1){const b=bot();if(confirm(`Delete ${b.name} and that employee’s assignments and messages?`)){state.bots=state.bots.filter(x=>x.id!==b.id);state.tasks=state.tasks.filter(x=>x.botId!==b.id);state.routines=state.routines.filter(x=>x.botId!==b.id);delete state.messages[b.id];state.activeBot=state.bots[0].id;goto('chat');}return;}if(action==='disconnect-api'){state.settings.apiUrl='';sessionToken='';sessionStorage.removeItem('agent-bot-studio:sessionToken');render();toast('AI server disconnected. Local work is preserved.');return;}if(action==='test-api'){const url=el('apiUrl')?.value.trim().replace(/\/+$/,'')||state.settings.apiUrl;if(!url){toast('Enter your server address first.');return;}try{const res=await fetch(url+'/health',{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});const obj=await res.json();toast(res.ok&&obj.ok?'Server reachable. Save your token to enable AI.':'Server did not pass health check.');}catch{toast('Cannot reach server. Check HTTPS, CORS, and server status.');}return;}if(action==='export-data'){const blob=new Blob([JSON.stringify({...state,exportedAt:now()},null,2)],{type:'application/json'});const href=URL.createObjectURL(blob);const link=document.createElement('a');link.href=href;link.download='agent-bot-studio-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);toast('Backup downloaded');return;}});
  document.addEventListener('submit',async e=>{const form=e.target;if(form.id==='composer'){e.preventDefault();if(busy)return;const v=el('messageInput').value.trim();if(!v)return;el('messageInput').value='';await sendMessage(v);return;}if(form.id==='newTaskForm'){e.preventDefault();const title=el('taskTitle').value.trim(),goal=el('taskGoal').value.trim();if(!title||!goal){toast('Assignment name and goal are required.');return;}state.tasks.unshift({id:uid(),botId:state.activeBot,title:title.slice(0,160),goal:goal.slice(0,1200),platform:el('taskPlatform').value,status:'queued',draft:'',created:now()});log('Created assignment: '+title);closeModal();goto('tasks');return;}if(form.id==='newBotForm'){e.preventDefault();const name=el('newBotName').value.trim(),role=el('newBotRole').value.trim();if(!name||!role){toast('Employee name and role are required.');return;}const b={id:uid(),name:name.slice(0,70),role:role.slice(0,120),brief:'',instructions:el('newBotInstructions').value.slice(0,3000),created:now()};state.bots.push(b);state.messages[b.id]=[];state.activeBot=b.id;log('Created employee profile',b.id);closeModal();goto('profile');return;}if(form.id==='newRoutineForm'){e.preventDefault();const title=el('routineTitle').value.trim(),goal=el('routineGoal').value.trim();if(!title||!goal){toast('Complete both routine fields.');return;}state.routines.push({id:uid(),botId:state.activeBot,title,goal});closeModal();render();return;}if(form.id==='profileForm'){e.preventDefault();const b=bot();b.name=el('profileName').value.trim().slice(0,70)||b.name;b.role=el('profileRole').value.trim().slice(0,120)||b.role;b.brief=el('profileBrief').value.slice(0,5500);b.instructions=el('profileInstructions').value.slice(0,3000);log('Updated employee profile');render();toast('Employee profile saved');return;}if(form.id==='settingsForm'){e.preventDefault();const url=el('apiUrl').value.trim().replace(/\/+$/,'');if(url&&!/^https:\/\//.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url)){toast('The backend must use HTTPS, except localhost development.');return;}state.settings.apiUrl=url;state.settings.search=el('enableSearch').checked;sessionToken=el('apiToken').value.trim();if(sessionToken)sessionStorage.setItem('agent-bot-studio:sessionToken',sessionToken);else sessionStorage.removeItem('agent-bot-studio:sessionToken');render();toast(url&&sessionToken?'Connection saved for this session.':'Settings saved. AI remains disconnected.');return;}});
  document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;if(file.size>5_000_000){toast('Backup file is too large.');return;}try{const data=JSON.parse(await file.text());if(!Array.isArray(data.bots)||!data.bots.length||!Array.isArray(data.tasks)||!data.messages||typeof data.messages!=='object'){throw new Error('Invalid Agent Bot Studio backup');}if(confirm('Import will replace all local bots, chats and assignments. Continue?')){state={...initial(),...data,settings:{...initial().settings,...data.settings},page:'chat'};if(!state.bots.some(b=>b.id===state.activeBot))state.activeBot=state.bots[0].id;sessionToken='';sessionStorage.removeItem('agent-bot-studio:sessionToken');save();render();toast('Workspace backup imported.');}}catch(e){toast('Import failed: '+e.message);}e.target.value='';});
  el('rosterToggle').addEventListener('click',()=>{el('sidebar').classList.add('open');el('shade').hidden=false;});el('shade').addEventListener('click',closeSidebar);el('addBot').addEventListener('click',()=>{closeSidebar();newBotModal();});el('topNew').addEventListener('click',newBotModal);el('closeModal').addEventListener('click',closeModal);el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar();}if(e.target.id==='messageInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('composer').requestSubmit();}});
  if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  render();
})();

</script>
</body>
