name: Deploy free Safari website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - icon.svg
      - sw.js
      - .github/workflows/deploy-safari-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static Safari app only
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
